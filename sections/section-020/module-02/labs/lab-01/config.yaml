# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# Read Endpoint State From Cilium Objects (LAB). UNTESTED: static checks only. Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-052-lab-020-02-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: install-cilium-and-seed
    description: "One `probe` pod, the `shuttle` and `drifter` pods, and no evidence report."
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-reference-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: endpoint-id-recorded
    description: "The report holds the live endpoint ID of probe"
    type: file
    source: validation/validate-endpoint-id-recorded.sh
    hint: "Read status.id of the probe CiliumEndpoint."
  - name: identity-recorded
    description: "The report holds the live identity of probe"
    type: file
    source: validation/validate-identity-recorded.sh
    hint: "Read status.identity.id, not status.id."
  - name: state-recorded
    description: "The report holds the live endpoint state of probe"
    type: file
    source: validation/validate-state-recorded.sh
    hint: "Read status.state of the CiliumEndpoint."
teardown:
  keepCluster: false
