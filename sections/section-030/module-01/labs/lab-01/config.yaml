# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# Record The IPAM Mode And Pool Settings (LAB). UNTESTED: static checks only. Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-052-lab-030-01-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: install-cilium-and-seed
    description: "Cilium runs in `cluster-pool` IPAM mode with the pool `10.100.0.0/16` and a per-node mask size of 24. No evidence report exists."
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-reference-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: ipam-mode-recorded
    description: "The report names the live IPAM mode"
    type: file
    source: validation/validate-ipam-mode-recorded.sh
    hint: "Read the ipam key of cilium-config."
  - name: pool-cidr-recorded
    description: "The report holds the live pool CIDR"
    type: file
    source: validation/validate-pool-cidr-recorded.sh
    hint: "Read cluster-pool-ipv4-cidr of cilium-config."
  - name: mask-size-recorded
    description: "The report holds the live mask size"
    type: file
    source: validation/validate-mask-size-recorded.sh
    hint: "Read cluster-pool-ipv4-mask-size of cilium-config."
teardown:
  keepCluster: false
