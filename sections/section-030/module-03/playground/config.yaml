# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# Multi-Pool IPAM (PLAYGROUND). Ungraded sandbox: no task, no submit.
apiVersion: astrona.io/v1
metadata:
  name: ats-052-playground-030-03
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: install-cilium-and-seed
    description: "Cilium runs in `multi-pool` mode with the pools `default` (10.10.0.0/16) and `green` (10.20.0.0/16). `drifter` is a Deployment in `outpost` and takes its address from `default`."
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
