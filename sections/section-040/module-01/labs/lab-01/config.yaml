# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# Change Agent Settings And Restart The Agents (LAB). UNTESTED: static checks only. Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-052-lab-040-01-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: install-cilium-and-seed
    description: "Cilium agents run on both nodes with debug logging switched off (`debug: \"false\"` in `cilium-config`)."
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-reference-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: debug-setting-enabled
    description: "The key debug in cilium-config is \"true\""
    type: file
    source: validation/validate-debug-setting-enabled.sh
    hint: "Patch the ConfigMap cilium-config in kube-system."
  - name: agents-were-restarted
    description: "The DaemonSet was restarted after the change"
    type: file
    source: validation/validate-agents-were-restarted.sh
    hint: "Use kubectl rollout restart on daemonset/cilium."
  - name: all-agents-ready
    description: "One ready agent runs on every node"
    type: file
    source: validation/validate-all-agents-ready.sh
    hint: "Wait for kubectl rollout status daemonset/cilium."
teardown:
  keepCluster: false
