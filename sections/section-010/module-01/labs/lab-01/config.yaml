# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# Record What Cilium Runs On The Cluster (LAB). UNTESTED: static checks only. Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-052-lab-010-01-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: install-cilium-and-seed
    description: "Two-node kind cluster with Cilium installed as the only network plugin, plus the `probe` Service, the `shuttle` pod and the `drifter` pod. No evidence ConfigMap exists."
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-reference-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: agent-image-recorded
    description: "The report names the live agent image"
    type: file
    source: validation/validate-agent-image-recorded.sh
    hint: "Read the image of the container named cilium-agent in the cilium DaemonSet."
  - name: ready-agents-recorded
    description: "The report holds the live number of ready agents"
    type: file
    source: validation/validate-ready-agents-recorded.sh
    hint: "Use status.numberReady of the cilium DaemonSet."
  - name: drifter-identity-recorded
    description: "The report holds the live identity of the drifter"
    type: file
    source: validation/validate-drifter-identity-recorded.sh
    hint: "Read status.identity.id of the CiliumEndpoint drifter in outpost."
teardown:
  keepCluster: false
