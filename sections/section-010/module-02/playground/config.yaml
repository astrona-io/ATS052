# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# Service Selection And Policy Failures (PLAYGROUND). Ungraded sandbox: no task, no submit.
apiVersion: astrona.io/v1
metadata:
  name: ats-052-playground-010-02
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: install-cilium-and-seed
    description: "The Service `probe` selects pods with the label `app: probe-api`, but the pods carry `app: probe`. No network policy exists."
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
